<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 Chat WebSocket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #eee;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            max-height: 700px;
            background: #1a1a2e;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #0f3460;
        }

        .header h1 {
            font-size: 22px;
            color: #e94560;
            letter-spacing: 1px;
        }

        .header .status {
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 20px;
            background: #333;
            color: #888;
        }

        .header .status.connected {
            background: #1b5e20;
            color: #66bb6a;
        }

        .header .status.disconnected {
            background: #5e1b1b;
            color: #ef5350;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px 0;
            margin: 10px 0;
            background: #0f3460;
            border-radius: 12px;
            padding: 15px;
            min-height: 300px;
            max-height: 500px;
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 3px;
        }

        #messages::-webkit-scrollbar-track {
            background: #0a0a0a;
            border-radius: 3px;
        }

        .msg {
            margin: 6px 0;
            padding: 8px 14px;
            border-radius: 10px;
            max-width: 85%;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 15px;
        }

        .msg.system {
            background: transparent;
            color: #ffd700;
            font-style: italic;
            text-align: center;
            max-width: 100%;
            font-size: 13px;
            padding: 4px;
        }

        .msg.other {
            background: #1a1a2e;
            border-left: 3px solid #e94560;
            margin-right: auto;
            border-radius: 10px 10px 10px 4px;
        }

        .msg.self {
            background: #e94560;
            margin-left: auto;
            border-radius: 10px 10px 4px 10px;
        }

        .msg .author {
            font-size: 12px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 2px;
        }

        .msg .time {
            font-size: 10px;
            color: #888;
            margin-left: 10px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid #0f3460;
        }

        #input {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 25px;
            background: #0f3460;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        #input:focus {
            box-shadow: 0 0 0 2px #e94560;
        }

        #input:disabled {
            opacity: 0.5;
        }

        #btn-send {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            background: #e94560;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        #btn-send:hover {
            background: #c73652;
            transform: scale(1.03);
        }

        #btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            padding-top: 10px;
            font-size: 12px;
            color: #555;
        }

        .footer a {
            color: #888;
            text-decoration: none;
        }

        .footer a:hover {
            color: #e94560;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                max-height: 100vh;
                width: 100%;
                border-radius: 0;
                padding: 15px;
            }
            .header h1 {
                font-size: 18px;
            }
            .msg {
                font-size: 14px;
            }
            #btn-send {
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <h1>💬 Chat</h1>
            <span class="status disconnected" id="status">⛔ Déconnecté</span>
        </div>

        <div id="messages"></div>

        <div class="input-area">
            <input type="text" id="input" placeholder="Tape ton message..." disabled>
            <button id="btn-send" disabled>Envoyer</button>
        </div>

        <div class="footer">
            <span>🔗 <span id="ws-url">wss://server-1-cnxd.onrender.com</span></span>
            <span>/help pour les commandes</span>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('btn-send');
        const statusEl = document.getElementById('status');

        // === CONFIGURATION ===
        const WS_URL = 'wss://server-1-cnxd.onrender.com';
        let ws = null;
        let connected = false;

        // === FONCTIONS ===
        function addMessage(type, content, author = '', time = '') {
            const div = document.createElement('div');
            div.className = `msg ${type}`;

            if (type === 'system') {
                div.textContent = content;
            } else {
                const authorSpan = document.createElement('span');
                authorSpan.className = 'author';
                authorSpan.textContent = author;
                div.appendChild(authorSpan);

                if (time) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'time';
                    timeSpan.textContent = time;
                    div.appendChild(timeSpan);
                }

                const contentSpan = document.createElement('div');
                contentSpan.textContent = content;
                div.appendChild(contentSpan);
            }

            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(state, msg) {
            statusEl.textContent = msg;
            statusEl.className = `status ${state}`;
        }

        function setConnected(state) {
            connected = state;
            input.disabled = !state;
            sendBtn.disabled = !state;
            if (state) {
                updateStatus('connected', '✅ Connecté');
                input.focus();
            } else {
                updateStatus('disconnected', '⛔ Déconnecté');
            }
        }

        function connect() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                ws.close();
                return;
            }

            addMessage('system', '🔗 Connexion en cours...');
            updateStatus('disconnected', '⏳ Connexion...');

            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    addMessage('system', '✅ Connecté au serveur !');
                    setConnected(true);
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);

                        if (data.type === 'system') {
                            addMessage('system', data.message);
                        } else if (data.type === 'message') {
                            addMessage('other', data.content, data.from, data.timestamp);
                        }
                    } catch (e) {
                        // Message brut (si serveur envoie du texte simple)
                        addMessage('system', event.data);
                    }
                };

                ws.onerror = (error) => {
                    addMessage('system', '❌ Erreur de connexion');
                    updateStatus('disconnected', '❌ Erreur');
                };

                ws.onclose = () => {
                    addMessage('system', '⛔ Déconnecté du serveur');
                    setConnected(false);
                    ws = null;
                };

            } catch (e) {
                addMessage('system', `❌ Erreur : ${e.message}`);
                setConnected(false);
            }
        }

        function sendMessage() {
            if (!connected || !ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('system', '❌ Pas connecté au serveur');
                return;
            }

            const text = input.value.trim();
            if (!text) return;

            // Afficher le message dans la bulle "self"
            addMessage('self', text, 'Moi');

            // Envoyer au serveur
            ws.send(text);
            input.value = '';
            input.focus();
        }

        // === ÉVÉNEMENTS ===
        sendBtn.addEventListener('click', sendMessage);

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // Connexion automatique au chargement
        window.addEventListener('load', () => {
            setTimeout(connect, 500);
        });

        // Reconnecter si on clique sur le statut
        statusEl.addEventListener('click', () => {
            if (!connected) {
                connect();
            }
        });

        // === MESSAGE D'ACCUEIL ===
        addMessage('system', '💬 Bienvenue sur le chat WebSocket !');
        addMessage('system', '📋 Tape /help pour voir les commandes.');
        addMessage('system', `🔗 Serveur : ${WS_URL}`);
    </script>

</body>
</html>
